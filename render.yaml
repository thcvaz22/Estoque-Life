services:
  - type: web
    name: life-sucos-aion
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: CLOUD_MODE
        value: "true"
      - key: CLOUD_PERSISTENCE_MODE
        value: neon-primary
      - key: DATABASE_URL
        sync: false
      - key: NEON_POOL_MAX
        value: "5"
      - key: NEON_RETRY_MS
        value: "5000"
      - key: DISABLE_AUTO_DB_BACKUP
        value: "true"
      - key: AUTH_SIGNING_SECRET
        generateValue: true
      - key: FISCAL_PROVIDER
        value: manual
      - key: AION_EXTERNAL_AI_ENABLED
        value: "true"
      - key: AION_WEB_SEARCH_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
