name: Testes Life Sucos

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar sintaxe dos arquivos novos
        run: |
          node --check server/logisticsRoutes.js
          node --check server/aionAgentRoutes.js
          node --check server/services/aionSkill.js
          node --check server/services/aionAgentCore.js
          node --check server/services/aionGoals.js
          node --check server/services/aionSpecialists.js
          node --check public/js/operational-logistics-v19.js
          node --check public/js/aion-context-v20.js
          node --check public/js/aion-agent-core-v30.js
          node --check server/app.js
      - name: Rodar suíte funcional
        env:
          BOOTSTRAP_ADMIN_USERNAME: admin
          BOOTSTRAP_ADMIN_PASSWORD: TestAdmin-v15-Only
          BOOTSTRAP_OPERATOR_USERNAME: operador
          BOOTSTRAP_OPERATOR_PASSWORD: TestOperator-v15-Only
          AION_EXTERNAL_AI_ENABLED: 'false'
          AION_WEB_SEARCH_ENABLED: 'false'
        run: node --test --test-concurrency=1 server/test/*.test.js
